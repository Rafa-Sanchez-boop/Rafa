services:
  - type: worker
    name: kalshi-ai-alerts
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    disk:
      name: kalshi-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/kalshi_bot.sqlite3
      - key: DAY1_MAX_SPREAD
        value: "0.08"
      - key: DAY1_UP_MID
        value: "0.60"
      - key: DAY1_DOWN_MID
        value: "0.40"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
