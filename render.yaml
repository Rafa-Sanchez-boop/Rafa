services:
  - type: worker
    name: kalshi-ai-alerts
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    disk:
      name: kalshi-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/kalshi_bot.sqlite3
      - key: KALSHI_SERIES
        value: KXBTC15M
      - key: KALSHI_ETH_SERIES
        value: KXETH15M
      - key: SCAN_SECONDS
        value: "20"
      - key: COMBO_WINDOW_SECONDS
        value: "360"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
